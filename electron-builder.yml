# PhantomChat desktop packaging (electron-builder).
# Linux ships x64 AppImage + .deb. macOS ships separate Apple Silicon and
# Intel DMGs. Windows ships separate x64 and arm64 NSIS installers. Signing
# stays out until the Axelera identities exist (see docs/ELECTRON-DESKTOP.md
# for the reserved secret names).
appId: ai.phantomyard.chat
productName: PhantomChat
copyright: Copyright © 2026 Hodges Enterprises B.V.

directories:
  buildResources: electron/build
  output: release/${version}

# The packaged bundle: the built frontend + the compiled electron main/preload.
# Everything else (sources, tests) stays out of the asar.
files:
  - dist/**
  - electron/dist/**
  - "!**/node_modules/**"

extraResources:
  - from: electron/build/icon.png
    to: icon.png

asar: true
compression: maximum

# Update feed (issue #164). This block does two things, and BOTH are
# required for in-app updates:
#   1. electron-builder emits update metadata next to the artifacts
#      (latest.yml on Windows, latest-mac.yml on macOS, latest-linux.yml on
#      Linux). Those files are
#      the feed electron-updater reads; without them there is nothing to
#      check against. They are produced during packaging, so `--publish never`
#      in CI still yields them — CI asserts their presence rather than
#      assuming it.
#   2. It writes app-update.yml into the packaged resources, which is how the
#      installed app knows WHERE to look.
#
# No `channel:` here on purpose. The ring is a CLIENT choice
# (allowPrerelease, see electron/updater.ts), so one set of artifacts serves
# both rings and promotion stays a metadata-only flip.
#
# macOS is in the feed now (issue #169). Squirrel.Mac's precondition — a
# Developer ID signed, notarized app — was met by #168, and the remaining two
# pieces land here: the zip target below, and latest-mac.yml wired through
# publish-release.sh / promote-release.sh.
publish:
  provider: github
  owner: phantomyard
  repo: phantomchat

linux:
  icon: electron/build/icon.png
  category: Network
  # Unsigned is acceptable for Linux per issue #150; SHA-256 checksums ship
  # alongside the artifacts.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  syncDesktopName: true
  maintainer: PhantomChat <chat@phantomyard.ai>
  vendor: Hodges Enterprises B.V.
  synopsis: Privacy-first messaging
  description: >
    PhantomChat is a privacy-first messaging app with end-to-end encryption
    and anonymous relay-based delivery. This package bundles the same UI as
    the web app into a native desktop window.
  # electron-builder generates the .desktop entry from productName/
  # description/category above. AppImage users get the same integration via
  # `phantomchat --install`.

deb:
  packageCategory: net
  artifactName: phantomchat_${version}_${arch}.${ext}
  # No afterInstall/afterRemove on purpose: electron-builder's stock
  # maintainer scripts create /usr/bin/phantomchat (update-alternatives),
  # set chrome-sandbox permissions, install + load the bundled AppArmor
  # profile (Ubuntu 24+) and refresh the desktop/MIME databases. A custom
  # script REPLACES all of that, and the previous one left the package with
  # no command on PATH and an app that aborted with a FATAL sandbox error.
  # scripts/check-deb-install.sh (CI) installs the .deb and asserts it.

appImage:
  # Artifacts must keep a predictable, versioned name for the checksums and
  # the promotion workflow.
  artifactName: ${productName}-${version}.${ext}

mac:
  icon: electron/build/icon.png
  category: public.app-category.social-networking
  # Signed with the Developer ID Application certificate the release workflow
  # imports from CSC_LINK/CSC_KEY_PASSWORD. Naming the identity pins WHICH
  # certificate is used, so a stray one in a runner's or a developer's
  # keychain can never be picked up silently.
  #
  # The "Developer ID Application:" prefix is deliberately absent:
  # electron-builder derives the certificate type itself and throws
  # InvalidConfigurationError if the prefix is included (findIdentity ->
  # checkPrefix in app-builder-lib).
  #
  # Builds without the certificate are not broken by this: PR CI runs on
  # pull_request, and electron-builder skips macOS signing on pull requests
  # outright, warning rather than failing.
  identity: Andrew Hodges (644GWVQQ4P)
  # Gatekeeper refuses to notarize anything without the hardened runtime, so
  # this and the entitlements below are load-bearing, not hygiene. Electron
  # needs the JIT/unsigned-memory exceptions listed in the plist.
  hardenedRuntime: true
  entitlements: electron/build/entitlements.mac.plist
  entitlementsInherit: electron/build/entitlements.mac.plist
  # Notarization is a separate workflow step against the DMG (notarytool +
  # stapler), not electron-builder's built-in hook: the ticket has to be
  # stapled to the artifact users actually download.
  notarize: false
  # BOTH targets are load-bearing and neither is optional:
  #   dmg — what a human downloads and drags to /Applications.
  #   zip — what Squirrel.Mac installs. MacUpdater picks the update payload
  #         with findFile(files, 'zip', ...) and throws
  #         ERR_UPDATER_ZIP_FILE_NOT_FOUND when the feed carries only a DMG,
  #         so a dmg-only release is a feed that cannot update anyone.
  # zip is listed first so it is files[0] in latest-mac.yml, which is what the
  # legacy top-level path/sha512 fields describe.
  target:
    - target: zip
      arch: [x64, arm64]
    - target: dmg
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: PhantomChat uses the microphone for voice messages and calls.
    NSCameraUsageDescription: PhantomChat uses the camera for video calls and sharing photos.

dmg:
  title: ${productName} ${version}

win:
  icon: electron/build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  # Keep the architectures separate so every installer is exercised on its
  # native runner and users never have to guess which payload they received.
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
  oneClick: true
  perMachine: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: PhantomChat
  uninstallDisplayName: ${productName} ${version}
