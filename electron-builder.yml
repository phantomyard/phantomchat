# PhantomChat desktop packaging (electron-builder).
# Linux ships x64 AppImage + .deb. macOS ships separate Apple Silicon and
# Intel DMGs. Windows ships separate x64 and arm64 NSIS installers. Signing
# stays out until the Axelera identities exist (see docs/ELECTRON-DESKTOP.md
# for the reserved secret names).
appId: ai.phantomyard.chat
productName: PhantomChat
copyright: Copyright © 2026 Hodges Enterprises B.V.

directories:
  buildResources: electron/build
  output: release/${version}

# The packaged bundle: the built frontend + the compiled electron main/preload.
# Everything else (sources, tests) stays out of the asar.
files:
  - dist/**
  - electron/dist/**
  - "!**/node_modules/**"

extraResources:
  - from: electron/build/icon.png
    to: icon.png

asar: true
compression: maximum

linux:
  icon: electron/build/icon.png
  category: Network
  # Unsigned is acceptable for Linux per issue #150; SHA-256 checksums ship
  # alongside the artifacts.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  syncDesktopName: true
  maintainer: PhantomChat <chat@phantomyard.ai>
  vendor: Hodges Enterprises B.V.
  synopsis: Privacy-first messaging
  description: >
    PhantomChat is a privacy-first messaging app with end-to-end encryption
    and anonymous relay-based delivery. This package bundles the same UI as
    the web app into a native desktop window.
  # electron-builder generates the .desktop entry from productName/
  # description/category above. AppImage users get the same integration via
  # `phantomchat --install`.

deb:
  packageCategory: net
  artifactName: phantomchat_${version}_${arch}.${ext}
  # No afterInstall/afterRemove on purpose: electron-builder's stock
  # maintainer scripts create /usr/bin/phantomchat (update-alternatives),
  # set chrome-sandbox permissions, install + load the bundled AppArmor
  # profile (Ubuntu 24+) and refresh the desktop/MIME databases. A custom
  # script REPLACES all of that, and the previous one left the package with
  # no command on PATH and an app that aborted with a FATAL sandbox error.
  # scripts/check-deb-install.sh (CI) installs the .deb and asserts it.

appImage:
  # Artifacts must keep a predictable, versioned name for the checksums and
  # the promotion workflow.
  artifactName: ${productName}-${version}.${ext}

mac:
  icon: electron/build/icon.png
  category: public.app-category.social-networking
  # Deliberately unsigned until Axelera B.V.'s Developer ID certificate is
  # available. `null` also prevents a developer's local Keychain identity
  # from making CI/local artifacts differ accidentally.
  identity: null
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: PhantomChat uses the microphone for voice messages and calls.
    NSCameraUsageDescription: PhantomChat uses the camera for video calls and sharing photos.

dmg:
  title: ${productName} ${version}

win:
  icon: electron/build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  # Keep the architectures separate so every installer is exercised on its
  # native runner and users never have to guess which payload they received.
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
  oneClick: true
  perMachine: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: PhantomChat
