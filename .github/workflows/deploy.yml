name: deploy

# Publishes the built PWA to GitHub Pages. Pages serves it at the custom domain
# in public/CNAME (chat.phantomyard.ai) and auto-provisions the Let's Encrypt
# certificate once DNS resolves — no Terraform/ACM, the same pattern as
# phantombot.bot.
#
# Deploy policy (2026-06-27): auto-deploy ONLY on merge to main. PR branches run
# tests/checks (ci.yml) but never auto-ship to the live Pages target. To deploy a
# feature branch on demand, use the manual "Run workflow" button (workflow_dispatch)
# in the Actions tab and pick the branch — gated by repo write access, so only
# collaborators (Andrew, Robbie, Kai, Lena) can trigger it. APP_VERSION =
# 1.0.<run_number> still bumps each run → new service worker → clients refresh.
#
# NO TAG JOB, deliberately (issue: Preview-channel 404). This workflow used to
# push a bare `v1.0.<run_number>` git tag after each deploy. Those tags carry no
# release and no assets, but they still appear in GitHub's releases.atom feed —
# and electron-updater's prerelease path (the Preview channel sets
# allowPrerelease) takes the FIRST atom entry without checking that a release
# exists, then fetches
# releases/download/<that tag>/latest-mac.yml → 404. Because a PWA deploy lands
# well before the desktop release publishes, a single such tag poisons Preview
# for every platform until the next real release. The in-bundle version comes
# from APP_VERSION/run_number, so nothing depends on the tag. Do not add it back.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege: Pages deploys need pages:write + id-token:write for the
# OIDC handshake that actions/deploy-pages performs. contents:read is enough
# to check out and build.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight production deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `generate-changelog` (part of `pnpm run build`)
          # can read tags/commits.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Versioning scheme: 1.0.<build_number>. github.run_number is the monotonic
      # per-workflow build counter (never regresses), matching phantombot's
      # 1.0.<build_number> tags. Vite bakes APP_VERSION into the bundle and emits
      # dist/version + dist/version.json.
      - run: pnpm run build
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
