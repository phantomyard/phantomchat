name: PWA 1. Build + deploy to Preview — automatic on merge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Share the lock with promotion: both preserve the other live channel.
concurrency:
  group: pwa-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp src/langPackLocalVersion.example.ts src/langPackLocalVersion.ts
      - name: Load the published Stable baseline
        id: baseline
        run: node scripts/releases/registry.mjs baseline
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build Preview and its promotion-ready Stable variant
        run: pnpm run build
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
          PWA_RELEASE: '1'
          CHANNEL_BASELINE: ${{ steps.baseline.outputs.baseline }}
          PWA_STABLE_DIST: .release-work/current/unpacked/site
      - name: Archive verified release and preserve published Stable bytes
        id: release
        run: node scripts/releases/registry.mjs prepare-preview
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL_BASELINE: ${{ steps.baseline.outputs.baseline }}
      - name: Check publication files
        run: node scripts/releases/check-site.mjs .release-work/payload/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .release-work/payload/site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Record successful publication
        run: node scripts/releases/registry.mjs published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
