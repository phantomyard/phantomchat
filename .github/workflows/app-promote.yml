name: app-promote

# Manually dispatched promotion of a tested desktop release candidate from
# the preview channel (GitHub prerelease) to stable (latest, non-prerelease).
# All verification and the metadata-only flip live in
# scripts/promote-release.sh — this workflow is the authenticated wrapper.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to promote (e.g. desktop-v1.0.42). Leave empty to promote the newest prerelease.'
        required: false
        default: ''
      confirm:
        description: 'Type PROMOTE to confirm — promotion changes what stable users receive.'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Guard rails
        env:
          CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
        run: |
          # Dispatch input is bound through env, never interpolated into the
          # script text — this step holds contents:write.
          if [[ "$CONFIRM_INPUT" != "PROMOTE" ]]; then
            echo "::error::Confirmation required: set the confirm input to PROMOTE."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: "Resolve tag (default: newest prerelease)"
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          # Dispatch input bound through env; the explicit-tag path is also
          # validated to a safe charset so it can never inject into the
          # output file or the downstream promote script.
          if [[ -n "$TAG_INPUT" ]]; then
            if [[ ! "$TAG_INPUT" =~ ^desktop-v[0-9A-Za-z._-]+$ ]]; then
              echo "::error::Invalid tag '${TAG_INPUT}' — expected desktop-v<version>."
              exit 1
            fi
            echo "tag=$TAG_INPUT" >> "$GITHUB_OUTPUT"
          else
            NEWEST="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease)][0].tagName')"
            if [[ -z "$NEWEST" || "$NEWEST" == "null" ]]; then
              echo "::error::No prerelease found to promote."
              exit 1
            fi
            echo "tag=$NEWEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote to stable (verify artifacts + checksums, flip metadata)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          chmod +x scripts/promote-release.sh
          ./scripts/promote-release.sh "$RELEASE_TAG" "$GITHUB_REPOSITORY"
