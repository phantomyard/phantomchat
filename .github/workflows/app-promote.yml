name: Electron 2. Promote Preview to Stable — manual

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Electron release tag. Empty selects newest published Preview.'
        required: false
        default: ''

concurrency:
  group: electron-release
  cancel-in-progress: false

permissions:
  contents: write        # edit the release (flip prerelease -> latest)

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve requested or newest Electron Preview
        id: tag
        run: node scripts/releases/registry.mjs resolve-electron
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INPUT: ${{ inputs.tag }}

      - name: Promote to stable (verify artifacts + checksums, flip metadata)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          chmod +x scripts/promote-release.sh
          ./scripts/promote-release.sh "$RELEASE_TAG" "$GITHUB_REPOSITORY"
