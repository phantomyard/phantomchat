name: ci

# PR updates run typechecks, unit tests, and the production browser smoke.
# Native Electron builds/packaging run only after a push to main or a manual
# dispatch. app-release.yml independently owns publishing desktop releases.
# Branch protection keeps the existing typecheck/test status names.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Explicit least-privilege scope. `pull_request` defaults to read-only
# already, but stating it makes the intended attack surface auditable.
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    # Per-job concurrency so a new push to the PR cancels the in-flight run
    # of *this* job only — the sibling `test` job cancels independently.
    concurrency:
      group: ci-typecheck-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # tsc resolves @/langPackLocalVersion, which the build normally
      # generates from the example. Seed it so the typecheck has it.
      - run: cp src/langPackLocalVersion.example.ts src/langPackLocalVersion.ts
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:channels
      - run: npx tsc --noEmit
      - run: pnpm run typecheck:electron

  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-test-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: cp src/langPackLocalVersion.example.ts src/langPackLocalVersion.ts
      - run: pnpm install --frozen-lockfile
      # `run` mode (not watch). The vitest config already excludes the
      # browser/Tor e2e suites and runs unit tests under jsdom.
      - run: pnpm exec vitest run

  browser:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-browser-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: cp src/langPackLocalVersion.example.ts src/langPackLocalVersion.ts
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          APP_VERSION: 0.0.0-ci.${{ github.run_number }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/channels/browser-smoke.mjs

  build-linux:
    # Keep native runtime, package, and update-feed verification after merge.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-build-linux-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: cp src/langPackLocalVersion.example.ts src/langPackLocalVersion.ts
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:electron
      - run: pnpm run build
        env:
          APP_VERSION: 0.0.0-ci.${{ github.run_number }}
      - run: node electron/build.mjs
      - run: xvfb-run -a node scripts/channels/electron-smoke.mjs
      # fpm needs rpmbuild to produce the .rpm target.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      - run: pnpm exec electron-builder --linux --publish never -c.extraMetadata.version=0.0.0-ci.${{ github.run_number }}
      - run: |
          cd release/0.0.0-ci.${{ github.run_number }}
          test -f PhantomChat-*.AppImage
          test -f phantomchat_*_amd64.deb
          test -f phantomchat_*_x86_64.rpm
          # The update feed (issue #164). Checked on main/manual CI, as well as at
          # release time: it is generated as a side effect of the publish
          # provider in electron-builder.yml, so a config change that drops
          # it must fail CI rather than produce a release nobody's installed
          # client can see.
          test -f latest-linux.yml
          grep -q '^version: 0.0.0-ci' latest-linux.yml
          # The deb AND the rpm must both be in the feed: electron-updater's
          # DebUpdater/RpmUpdater pick their payload out of this file, so a
          # feed without them cannot update package-managed installs.
          grep -q 'phantomchat_.*_amd64.deb' latest-linux.yml
          grep -q 'phantomchat_.*_x86_64.rpm' latest-linux.yml
          # resources/package-type is how electron-updater 6.6+ knows this is
          # a deb/rpm install — assert it ships in BOTH packages.
          rpm -qlp phantomchat_*_x86_64.rpm | grep -q 'resources/package-type' \
            || { echo '::error::rpm is missing resources/package-type — DebUpdater/RpmUpdater can never engage'; exit 1; }
          dpkg-deb -c phantomchat_*_amd64.deb | grep -q 'resources/package-type' \
            || { echo '::error::deb is missing resources/package-type — DebUpdater/RpmUpdater can never engage'; exit 1; }
          sha256sum PhantomChat-*.AppImage phantomchat_*_amd64.deb phantomchat_*_x86_64.rpm > SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt
      - name: Install the .deb and check maintainer scripts
        run: scripts/check-deb-install.sh release/0.0.0-ci.${{ github.run_number }}/phantomchat_*_amd64.deb

  build-macos:
    if: github.event_name != 'pull_request'
    # Build and mount each architecture on native hardware. Cross-packaging
    # alone cannot prove the bundled Electron executable starts on that CPU.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: ci-build-macos-${{ matrix.arch }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: cp src/langPackLocalVersion.example.ts src/langPackLocalVersion.ts
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:electron
      - run: pnpm run build
        env:
          APP_VERSION: 0.0.0-ci.${{ github.run_number }}
      - run: node electron/build.mjs
      - run: node scripts/channels/electron-smoke.mjs
      # Same two targets the release builds (issue #169), so a packaging
      # change that breaks the update zip or the feed fails in native CI rather
      # than on a user's Mac. Signing is not exercised here — electron-builder
      # skips it on pull requests anyway.
      - name: Package unsigned DMG and update zip
        run: pnpm exec electron-builder --mac zip dmg --$ARCH --publish never -c.extraMetadata.version="$VERSION"
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: 0.0.0-ci.${{ github.run_number }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Assert the macOS update feed was generated
        run: test -f "release/${VERSION}/latest-mac.yml" || { echo "::error::latest-mac.yml missing — electron-builder produced no update feed"; exit 1; }
        env:
          VERSION: 0.0.0-ci.${{ github.run_number }}
      - name: Mount and verify packaged app
        run: scripts/check-macos-package.sh "release/${VERSION}/PhantomChat-${VERSION}-${ARCH}.dmg" "$ARCH" "$VERSION"
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: 0.0.0-ci.${{ github.run_number }}
      - name: Verify the update zip
        run: scripts/check-macos-update-zip.sh "release/${VERSION}/PhantomChat-${VERSION}-${ARCH}.zip" "$VERSION"
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: 0.0.0-ci.${{ github.run_number }}

  build-windows:
    if: github.event_name != 'pull_request'
    # Build, install, launch and uninstall each architecture on native
    # hardware. The hosted image is fresh, so this also exercises first-time
    # Start Menu integration without inheriting a previous installation.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: ci-build-windows-${{ matrix.arch }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: Copy-Item src/langPackLocalVersion.example.ts src/langPackLocalVersion.ts
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:electron
      - run: pnpm run build
        env:
          APP_VERSION: 0.0.0-ci.${{ github.run_number }}
      - run: node electron/build.mjs
      - run: node scripts/channels/electron-smoke.mjs
      - name: Package unsigned Windows installer
        shell: pwsh
        run: pnpm exec electron-builder --win nsis "--$env:ARCH" --publish never "-c.extraMetadata.version=$env:VERSION"
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: 0.0.0-ci.${{ github.run_number }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Install, launch and uninstall packaged app
        shell: pwsh
        run: scripts/check-windows-package.ps1 "release/$env:VERSION/PhantomChat-$env:VERSION-windows-$env:ARCH.exe" $env:ARCH $env:VERSION
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: 0.0.0-ci.${{ github.run_number }}
