name: ci

# Runs on every PR targeting main. No `push:` block on purpose — the
# `pull_request` event already restricts this to branches with an open PR.
# Branch protection on main wires `typecheck` and `test` as required status
# checks, mirroring the phantombot repo's CI contract.
#
# Toolchain note: phantombot is a Bun project; PhantomChat is a Vite/SolidJS
# PWA built with pnpm (packageManager pin: pnpm@9.15.3). The job *names*
# (`typecheck`, `test`), triggers, least-privilege permissions and per-job
# concurrency match phantombot; only the runtime is adapted to pnpm.

on:
  pull_request:
    branches: [main]

# Explicit least-privilege scope. `pull_request` defaults to read-only
# already, but stating it makes the intended attack surface auditable.
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    # Per-job concurrency so a new push to the PR cancels the in-flight run
    # of *this* job only — the sibling `test` job cancels independently.
    concurrency:
      group: ci-typecheck-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # tsc resolves @/langPackLocalVersion, which the build normally
      # generates from the example. Seed it so the typecheck has it.
      - run: cp src/langPackLocalVersion.example.ts src/langPackLocalVersion.ts
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-test-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: cp src/langPackLocalVersion.example.ts src/langPackLocalVersion.ts
      - run: pnpm install --frozen-lockfile
      # `run` mode (not watch). The vitest config already excludes the
      # browser/Tor e2e suites and runs unit tests under jsdom.
      - run: pnpm exec vitest run

  build-linux:
    # Proves the desktop pipeline (issue #150, PR#1) builds from a clean
    # checkout on every PR: PWA build, electron main/preload bundle + CSP,
    # and the AppImage/deb packaging. Artifacts are NOT published here —
    # releases go through app-release.yml (tag/manual, prerelease-first).
    runs-on: ubuntu-latest
    concurrency:
      group: ci-build-linux-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: cp src/langPackLocalVersion.example.ts src/langPackLocalVersion.ts
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:electron
      - run: pnpm run build
      - run: node electron/build.mjs
      - run: pnpm exec electron-builder --linux --publish never -c.extraMetadata.version=0.0.0-ci.${{ github.run_number }}
      - run: |
          cd release/0.0.0-ci.${{ github.run_number }}
          test -f PhantomChat-*.AppImage
          test -f phantomchat_*_amd64.deb
          # The update feed (issue #164). Checked on every PR, not just at
          # release time: it is generated as a side effect of the publish
          # provider in electron-builder.yml, so a config change that drops
          # it must fail HERE rather than produce a release nobody's installed
          # client can see.
          test -f latest-linux.yml
          grep -q '^version: 0.0.0-ci' latest-linux.yml
          sha256sum PhantomChat-*.AppImage phantomchat_*_amd64.deb > SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt
      - name: Install the .deb and check maintainer scripts
        run: scripts/check-deb-install.sh release/0.0.0-ci.${{ github.run_number }}/phantomchat_*_amd64.deb

  build-macos:
    # Build and mount each architecture on native hardware. Cross-packaging
    # alone cannot prove the bundled Electron executable starts on that CPU.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: ci-build-macos-${{ matrix.arch }}-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: cp src/langPackLocalVersion.example.ts src/langPackLocalVersion.ts
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:electron
      - run: pnpm run build
      - run: node electron/build.mjs
      - name: Package unsigned DMG
        run: pnpm exec electron-builder --mac dmg --$ARCH --publish never -c.extraMetadata.version="$VERSION"
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: 0.0.0-ci.${{ github.run_number }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Mount and verify packaged app
        run: scripts/check-macos-package.sh "release/${VERSION}/PhantomChat-${VERSION}-${ARCH}.dmg" "$ARCH" "$VERSION"
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: 0.0.0-ci.${{ github.run_number }}

  build-windows:
    # Build, install, launch and uninstall each architecture on native
    # hardware. The hosted image is fresh, so this also exercises first-time
    # Start Menu integration without inheriting a previous installation.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: ci-build-windows-${{ matrix.arch }}-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: Copy-Item src/langPackLocalVersion.example.ts src/langPackLocalVersion.ts
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:electron
      - run: pnpm run build
        env:
          APP_VERSION: 0.0.0-ci.${{ github.run_number }}
      - run: node electron/build.mjs
      - name: Package unsigned Windows installer
        shell: pwsh
        run: pnpm exec electron-builder --win nsis "--$env:ARCH" --publish never "-c.extraMetadata.version=$env:VERSION"
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: 0.0.0-ci.${{ github.run_number }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Install, launch and uninstall packaged app
        shell: pwsh
        run: scripts/check-windows-package.ps1 "release/$env:VERSION/PhantomChat-$env:VERSION-windows-$env:ARCH.exe" $env:ARCH $env:VERSION
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: 0.0.0-ci.${{ github.run_number }}
