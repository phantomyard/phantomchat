name: PR checks — automatic on every PR

# PRs check local and deployed compatibility, typechecks and unit tests, and
# compile BOTH channels (pinned Stable + this PR's Preview) without publishing.
# PWA Preview publishes on merge to main; Electron Preview and Stable promotion are manual.
on:
  pull_request:
    branches: [main]

# Explicit least-privilege scope. `pull_request` defaults to read-only
# already, but stating it makes the intended attack surface auditable.
permissions:
  contents: read

jobs:
  # Decides whether this PR can affect the channel build at all. Docs-only and
  # unrelated changes skip the compile, which is the expensive job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Check build-relevant paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "changed files:${changed}"
          if grep -Eq '^(src/|public/|scripts/channels/|package\.json|pnpm-lock\.yaml|vite\.config\.|index\.html|tsconfig|\.github/workflows/ci\.yml)' <<<"$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  typecheck:
    runs-on: ubuntu-latest
    # Per-job concurrency so a new push to the PR cancels the in-flight run
    # of *this* job only — the sibling `test` job cancels independently.
    concurrency:
      group: ci-typecheck-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # tsc resolves @/langPackLocalVersion, which the build normally
      # generates from the example. Seed it so the typecheck has it.
      - run: cp src/langPackLocalVersion.example.ts src/langPackLocalVersion.ts
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:channels
      - name: Check compatibility with published Stable
        run: node scripts/channels/check-published.mjs
      - run: npx tsc --noEmit
      - run: pnpm run typecheck:electron

  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-test-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: cp src/langPackLocalVersion.example.ts src/langPackLocalVersion.ts
      - run: pnpm install --frozen-lockfile
      # `run` mode (not watch). The vitest config already excludes the
      # browser/Tor e2e suites and runs unit tests under jsdom.
      - run: node --test scripts/releases/registry.node-test.mjs
      - run: pnpm exec vitest run

  # Dry channel build: compiles the pinned Stable tree AND this PR's Preview
  # tree, then runs the cross-version storage smoke test between them. No
  # CHANNEL_BASELINE, no PWA_RELEASE, no Pages artifact, no publication. It
  # exists so a broken compile or a stale pin fails on the PR instead of
  # during a Stable promotion, where the failure is already deployed.
  channel-build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-channel-build-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      # Full history is REQUIRED, not a convenience: build.mjs resolves
      # `phantomchat-v<stableVersion>` and asserts it equals config.stableRef
      # (build.mjs:16-19), then `git archive`s both the pinned Stable ref and
      # this PR's commit. A shallow checkout has neither the tag nor
      # necessarily the pinned commit, so the job dies in the Stable-SHA
      # assertion before compiling anything. Do not "speed up" this job by
      # removing fetch-depth without moving that check first.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: cp src/langPackLocalVersion.example.ts src/langPackLocalVersion.ts
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
