name: app-release

# Desktop-app release pipeline (issue #150) — mirrors phantombot's release.yml.
#
# Fires on pushes to main (i.e. PR merges — branch protection requires PRs, so
# a push to main IS a merge) except docs-only merges, which the paths-ignore
# denylist below filters out. Cuts a GitHub Release tagged
# phantomchat-v1.0.<N> with Linux (AppImage + deb), macOS (Intel +
# Apple Silicon DMG), and Windows (x64 + arm64 NSIS) artifacts, plus
# SHA256SUMS.txt. The Windows installers are Authenticode signed in the
# publish job; Linux and macOS are still unsigned.
#
# VERSION SYNC: <N> is NOT this workflow's run_number — it is the run_number
# of the deploy.yml (PWA) run for the same commit, so the desktop app and the
# PWA from one merge carry the same 1.0.<N>. See "Resolve version" below.
#
# Why a run_number and not the PR number (same rationale as phantombot):
# PR numbers can regress if a later-numbered PR merges before an earlier one
# (v1.0.50 shipping after v1.0.49 confuses humans and breaks ordering
# heuristics). github.run_number is a per-workflow monotonic counter — it only
# ever goes up, and every value points at exactly one Actions run, so a
# deployed artifact pivots to its build in one click. The originating PR is
# preserved in the release title/notes so the audit trail stays intact.
#
# The version/tag are synthesized BY THIS WORKFLOW from that counter — nobody
# pushes a phantomchat-v* tag by hand and there is no dispatch input, so no
# user-controlled text can reach a shell. Every value crosses step boundaries
# env-bound; there is zero ${{ }} interpolation inside run: blocks (the
# posture established in review round 3). The strict-semver grammar guard
# stays in scripts/publish-release.sh as defense in depth.
#
# RELEASE RINGS — every release cut here is a PRERELEASE (preview channel).
# `gh release create --prerelease` keeps it out of /releases/latest, which is
# what a stable client will resolve against once in-app updates land; a merge
# therefore reaches only preview-ring users. Promotion to stable is a HUMAN
# act: run the app-promote workflow. It flips metadata on a release that
# ALREADY EXISTS — no rebuild, no re-tag. The bytes stable users install are
# byte-for-byte the ones that soaked on preview. Why CI cannot decide this:
# green tests are the bar for MERGING; if they were also the bar for stable,
# the two rings would be the same ring. Stable means a human ran the build.
#
# paths-ignore is a DENYLIST (fail-open to releasing), not an allowlist:
# anything NOT listed still triggers a release, so a functional change we
# forgot to list can never silently skip one. Over-releasing is harmless (a
# duplicate-content build at a higher version); under-releasing ships a fix
# to nobody. This repo squash-merges, so the pushed commit carries the PR's
# FULL diff and a mixed PR (docs + src) still releases.
#
# Promotion fails closed until every required architecture exists
# (REQUIRED_ARTIFACTS in scripts/promote-release.sh).

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE'
      - 'docs/**'

permissions:
  contents: write        # create release + tag + upload assets
  pull-requests: read    # commits->pulls lookup for the release audit trail
  actions: read          # look up the PWA deploy run to share its version

jobs:
  linux:
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      pr-number: ${{ steps.pr.outputs.number }}
      pr-title: ${{ steps.pr.outputs.title }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4
        with:
          # github.sha on a push to main is the merge commit itself.
          ref: ${{ github.sha }}

      - name: Resolve originating PR (audit trail only)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # On a push event there is no github.event.pull_request context,
          # so recover the PR that introduced this merge commit from the
          # commits->pulls API. Best-effort: a direct push to main yields an
          # empty number and the release still cuts — the PR ref is purely
          # for the audit trail in the title/notes.
          PR_JSON=$(gh api "repos/${REPO}/commits/${SHA}/pulls" 2>/dev/null || echo '[]')
          NUMBER=$(echo "$PR_JSON" | jq -r '.[0].number // ""')
          TITLE=$(echo "$PR_JSON" | jq -r '.[0].title // ""')
          # Fall back to the commit subject if no PR was found.
          if [ -z "$TITLE" ]; then
            TITLE=$(git log -1 --pretty=%s)
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Resolved PR number='$NUMBER' title='$TITLE'"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: cp src/langPackLocalVersion.example.ts src/langPackLocalVersion.ts
      - run: pnpm install --frozen-lockfile

      # Versioning: the desktop app ships the SAME version as the PWA built
      # from the same merge. deploy.yml fires on the same push and stamps
      # the PWA 1.0.<its run_number>, so we look up that deploy run by
      # head_sha and reuse its run_number. Both runs are created by the one
      # push event, so the lookup only retries briefly while GitHub lists
      # it. deploy.yml's counter is monotonic, so desktop versions still
      # only ever go up (they skip numbers when a docs-only merge or a
      # manual branch deploy bumps the PWA without a desktop release).
      # The version feeds the bundled UI (APP_VERSION) and the packaged app
      # via electron-builder's extraMetadata override; the checked-in
      # package.json is never mutated. Fails closed: no deploy run, no
      # release. publish-release.sh re-checks the grammar before publishing.
      - name: Resolve version (shared with the PWA deploy)
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          RUN_NUMBER=""
          for attempt in $(seq 1 12); do
            RUN_NUMBER=$(gh api "repos/${REPO}/actions/workflows/deploy.yml/runs?head_sha=${SHA}&event=push&per_page=1" \
              --jq '.workflow_runs[0].run_number // ""' 2>/dev/null || true)
            [ -n "$RUN_NUMBER" ] && break
            echo "deploy run for ${SHA} not listed yet (attempt ${attempt}), retrying in 10s"
            sleep 10
          done
          if ! [[ "$RUN_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::no numeric deploy.yml run number for ${SHA} (got '${RUN_NUMBER}')"
            exit 1
          fi
          VERSION="1.0.${RUN_NUMBER}"
          TAG="phantomchat-v${VERSION}"
          echo "Desktop version ${VERSION} (PWA deploy run #${RUN_NUMBER})"
          printf 'version=%s\ntag=%s\n' "$VERSION" "$TAG" >> "$GITHUB_OUTPUT"

      - name: Build frontend + electron main/preload
        run: |
          pnpm run build
          node electron/build.mjs
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}

      - name: Package Linux artifacts (AppImage + deb, x64)
        run: pnpm exec electron-builder --linux --publish never -c.extraMetadata.version="$VERSION"
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      # The update feed (issue #164). electron-builder writes latest-linux.yml
      # during packaging because electron-builder.yml now carries a publish
      # provider; `--publish never` only suppresses the UPLOAD. Assert it
      # rather than assume it: a silently missing feed would ship a release
      # that no installed client can ever see.
      - name: Assert the Linux update feed was generated
        run: test -f "release/${VERSION}/latest-linux.yml" || { echo "::error::latest-linux.yml missing — electron-builder produced no update feed"; exit 1; }
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Upload Linux artifacts for publication
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            release/${{ steps.ver.outputs.version }}/PhantomChat-${{ steps.ver.outputs.version }}.AppImage
            release/${{ steps.ver.outputs.version }}/phantomchat_${{ steps.ver.outputs.version }}_amd64.deb
            release/${{ steps.ver.outputs.version }}/latest-linux.yml
          if-no-files-found: error

  macos:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: cp src/langPackLocalVersion.example.ts src/langPackLocalVersion.ts
      - run: pnpm install --frozen-lockfile

      - name: Build frontend + electron main/preload
        run: |
          pnpm run build
          node electron/build.mjs
        env:
          APP_VERSION: ${{ needs.linux.outputs.version }}

      - name: Package unsigned macOS DMG
        run: pnpm exec electron-builder --mac dmg --$ARCH --publish never -c.extraMetadata.version="$VERSION"
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.linux.outputs.version }}
          # Defense in depth alongside mac.identity=null: never pick up a
          # certificate that happens to be installed on a runner.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Mount and verify packaged app
        run: scripts/check-macos-package.sh "release/${VERSION}/PhantomChat-${VERSION}-${ARCH}.dmg" "$ARCH" "$VERSION"
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.linux.outputs.version }}

      - name: Upload macOS artifact for publication
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: release/${{ needs.linux.outputs.version }}/PhantomChat-${{ needs.linux.outputs.version }}-${{ matrix.arch }}.dmg
          if-no-files-found: error

  windows:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: Copy-Item src/langPackLocalVersion.example.ts src/langPackLocalVersion.ts
      - run: pnpm install --frozen-lockfile

      - name: Build frontend + electron main/preload
        run: |
          pnpm run build
          node electron/build.mjs
        env:
          APP_VERSION: ${{ needs.linux.outputs.version }}

      # Unsigned here on purpose: Authenticode signing happens once, in the
      # publish job, against the installers that are actually published.
      - name: Package Windows installer (signed later, in publish)
        shell: pwsh
        run: pnpm exec electron-builder --win nsis "--$env:ARCH" --publish never "-c.extraMetadata.version=$env:VERSION"
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.linux.outputs.version }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Install, launch and uninstall packaged app
        shell: pwsh
        run: scripts/check-windows-package.ps1 "release/$env:VERSION/PhantomChat-$env:VERSION-windows-$env:ARCH.exe" $env:ARCH $env:VERSION
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.linux.outputs.version }}

      # Both Windows runners emit a file literally called latest.yml, each
      # describing only its own architecture. Uploaded as-is they collide and
      # whichever lands last would offer ITS installer to every Windows user —
      # handing arm64 machines an x64 build, or the reverse. Rename here, then
      # merge into one feed in the publish job.
      - name: Stage the Windows update feed under an architecture-specific name
        shell: pwsh
        run: |
          $feed = "release/$env:VERSION/latest.yml"
          if(-not (Test-Path $feed)) {
            Write-Output "::error::latest.yml missing — electron-builder produced no update feed"
            exit 1
          }
          Move-Item $feed "release/$env:VERSION/latest-windows-$env:ARCH.yml"
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.linux.outputs.version }}

      - name: Upload Windows artifact for publication
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ matrix.arch }}
          path: |
            release/${{ needs.linux.outputs.version }}/PhantomChat-${{ needs.linux.outputs.version }}-windows-${{ matrix.arch }}.exe
            release/${{ needs.linux.outputs.version }}/latest-windows-${{ matrix.arch }}.yml
          if-no-files-found: error

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release/${{ needs.linux.outputs.version }}

      # Only needed for js-yaml in the feed merge below.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # One latest.yml listing BOTH Windows installers, so electron-updater
      # resolves the right architecture on each machine. Fails closed on a
      # version mismatch or a duplicate artifact (scripts/merge-update-feed.mjs).
      # x64 is passed first deliberately: it is the fallback entry the updater
      # uses when it cannot match an architecture.
      # ---------------------------------------------------------------
      # Windows Authenticode signing (SSL.com eSigner, cloud HSM)
      # ---------------------------------------------------------------
      #
      # WHY IN THE PUBLISH JOB, ON LINUX, AND NOT ON THE WINDOWS RUNNERS: the
      # private key is not downloadable — it lives in SSL.com's HSM, and
      # CodeSignTool is a Java client that sends a digest and gets a signature
      # back, so the host OS is irrelevant. Doing it here keeps the arm64
      # runner (windows-11-arm) out of the JDK-plus-vendor-tool business
      # entirely, and puts signing in the one job that already owns the
      # published bytes: the feed merge and the checksums happen right below,
      # so nothing can be stamped before the installers reach their final form.
      #
      # WHY AT BUILD AND NOT AT PROMOTE: app-promote.yml never rebuilds. It
      # flips an existing release to stable so the artifacts that soaked on
      # preview are the artifacts stable installs, and it verifies the
      # published checksums first. Signing at promote would have to mutate
      # published assets, regenerate latest.yml, and re-upload — putting the
      # updater feed back in the blast radius for every promotion. Signing here
      # also means preview builds are signed, so the ring soaks the real thing.
      #
      # WHAT IS SIGNED: the two published NSIS installers, and only those.
      # electron-builder's own `sign` hook would additionally sign the app
      # executable and the uninstaller inside each package, and cloud signing
      # is metered per signing operation — four more operations per merge for
      # files a user never downloads directly. The installer is what a browser
      # hands to SmartScreen, so that is what carries the signature.
      #
      # WHY THE ACTION IS PINNED TO A COMMIT SHA: it receives our signing
      # credentials. A moving tag (or @develop, which the vendor README
      # suggests) would let upstream change what executes here after review.
      # The sha below is v1.3.2; re-pin deliberately when upgrading.
      #
      # ES_CREDENTIAL_ID is not optional: the signing account also carries a
      # document-sealing "eSeal" credential which is marked DEFAULT, so an
      # omitted id would silently sign with the wrong one.
      #
      # This workflow only runs on push to main, so secrets are always
      # available and a fork PR can never reach this job.
      - name: Assert signing credentials are present
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          # Fail loudly rather than degrading to an unsigned release: notes
          # that promise a signature on artifacts that do not carry one are
          # worse than a release that did not happen.
          missing=""
          for v in ES_USERNAME ES_PASSWORD ES_CREDENTIAL_ID ES_TOTP_SECRET; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing eSigner secret(s):$missing"
            exit 1
          fi

      - name: Sign the Windows x64 installer
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/release/${{ needs.linux.outputs.version }}/PhantomChat-${{ needs.linux.outputs.version }}-windows-x64.exe
          output_path: ${{ github.workspace }}/signed
          environment_name: PROD
          # The malware pre-scan is a separate SSL.com service; leaving it off
          # keeps this to one signing operation per installer.
          malware_block: false

      - name: Sign the Windows arm64 installer
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/release/${{ needs.linux.outputs.version }}/PhantomChat-${{ needs.linux.outputs.version }}-windows-arm64.exe
          output_path: ${{ github.workspace }}/signed
          environment_name: PROD
          malware_block: false

      # CodeSignTool writes the signed copy to output_path and leaves the input
      # alone, so put the signed installers back where the feed, the checksums
      # and the release upload all already expect them.
      - name: Swap in the signed installers
        run: |
          set -euo pipefail
          for arch in x64 arm64; do
            name="PhantomChat-${VERSION}-windows-${arch}.exe"
            # A missing output is the silent-failure mode that matters here:
            # the vendor action decides success by grepping its own stdout, so
            # it can report green having produced nothing at all.
            [ -s "signed/${name}" ] || { echo "::error::signed/${name} missing or empty — signing produced no artifact"; exit 1; }
            mv "signed/${name}" "release/${VERSION}/${name}"
          done
        env:
          VERSION: ${{ needs.linux.outputs.version }}

      # Independent proof that a signature is embedded and that it is OUR
      # certificate — not the signing tool's own say-so, and not the eSeal
      # credential. Chain and timestamp validation are deliberately NOT
      # asserted: the runner has no reason to trust SSL.com's roots and a
      # transient TSA hiccup should not fail a release.
      - name: Verify the embedded Authenticode signatures
        env:
          VERSION: ${{ needs.linux.outputs.version }}
          EXPECTED_SIGNER: Andrew Hodges
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osslsigncode
          for arch in x64 arm64; do
            f="release/${VERSION}/PhantomChat-${VERSION}-windows-${arch}.exe"
            echo "--- $f"
            # Non-zero exit here means "could not verify the chain", which we
            # are not asserting, so judge on content rather than exit status.
            out=$(osslsigncode verify -in "$f" 2>&1 || true)
            echo "$out"
            case "$out" in
              *"No signature found"*)
                echo "::error::$f is NOT signed"; exit 1 ;;
            esac
            echo "$out" | grep -qi "CN=${EXPECTED_SIGNER}" \
              || { echo "::error::$f is signed by an unexpected certificate (expected CN=${EXPECTED_SIGNER})"; exit 1; }
          done

      - name: Merge the Windows update feeds
        run: |
          cd "release/${VERSION}"
          node ../../scripts/merge-update-feed.mjs latest.yml latest-windows-x64.yml latest-windows-arm64.yml
          # The per-arch inputs are build intermediates, not release assets.
          rm latest-windows-x64.yml latest-windows-arm64.yml
        env:
          VERSION: ${{ needs.linux.outputs.version }}

      # Signing rewrote the installers, so every hash electron-builder put in
      # latest.yml now describes bytes that no longer exist. electron-updater
      # verifies the download against that sha512 and REFUSES to install on a
      # mismatch — this is not a cosmetic drift, it is every Windows update
      # failing with a checksum error. Re-stamp the merged feed against the
      # signed files on disk (scripts/restamp-update-feed.mjs).
      #
      # latest-linux.yml is untouched on purpose: nothing rewrites the Linux
      # artifacts after packaging.
      - name: Re-stamp the Windows feed against the signed installers
        run: node scripts/restamp-update-feed.mjs "release/${VERSION}/latest.yml"
        env:
          VERSION: ${{ needs.linux.outputs.version }}

      - name: Generate and verify checksums
        run: |
          cd "release/${VERSION}"
          # The feed files are checksummed alongside the installers: they are
          # published assets, and promote-release.sh requires every asset on a
          # release to be covered by SHA256SUMS.txt.
          sha256sum \
            "PhantomChat-${VERSION}.AppImage" \
            "phantomchat_${VERSION}_amd64.deb" \
            "PhantomChat-${VERSION}-x64.dmg" \
            "PhantomChat-${VERSION}-arm64.dmg" \
            "PhantomChat-${VERSION}-windows-x64.exe" \
            "PhantomChat-${VERSION}-windows-arm64.exe" \
            "latest.yml" \
            "latest-linux.yml" > SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt
          cat SHA256SUMS.txt
        env:
          VERSION: ${{ needs.linux.outputs.version }}

      - name: Write release notes to file
        env:
          TAG: ${{ needs.linux.outputs.tag }}
          VERSION: ${{ needs.linux.outputs.version }}
          PR_NUMBER: ${{ needs.linux.outputs.pr-number }}
          PR_TITLE: ${{ needs.linux.outputs.pr-title }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          SHA: ${{ github.sha }}
        run: |
          # PR_NUMBER is empty for a direct push (no PR). Render the
          # originating-PR lines only when we actually resolved one.
          if [ -n "$PR_NUMBER" ]; then
            ORIGIN_LINE="Originating PR: #${PR_NUMBER} — ${PR_TITLE}"
            PR_LINK_LINE="Pull request: ${SERVER_URL}/${REPO}/pull/${PR_NUMBER}"
          else
            ORIGIN_LINE="Originating commit: ${SHA} — ${PR_TITLE}"
            PR_LINK_LINE="Commit: ${SERVER_URL}/${REPO}/commit/${SHA}"
          fi
          cat > release-notes.md <<EOF
          Automated desktop release from workflow run #${RUN_NUMBER} (run id ${RUN_ID}).
          ${ORIGIN_LINE}

          Build run: ${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}
          ${PR_LINK_LINE}

          Artifacts (Windows installers Authenticode signed as "Andrew Hodges";
          Linux and macOS unsigned):
          Linux x64:
          - PhantomChat-${VERSION}.AppImage
          - phantomchat_${VERSION}_amd64.deb
          macOS:
          - PhantomChat-${VERSION}-arm64.dmg (Apple Silicon)
          - PhantomChat-${VERSION}-x64.dmg (Intel)
          Windows:
          - PhantomChat-${VERSION}-windows-arm64.exe (ARM64)
          - PhantomChat-${VERSION}-windows-x64.exe (x64)

          Update feed (consumed by the in-app updater, not a download):
          - latest.yml (Windows)
          - latest-linux.yml (Linux AppImage)

          Verify with: sha256sum -c SHA256SUMS.txt
          Install and channel docs: docs/ELECTRON-DESKTOP.md

          Release ring: PREVIEW. This is a prerelease, so it is not served as
          the stable/latest release. To ship it to everyone, run the
          app-promote workflow against ${TAG} — that flips this exact release
          (same artifacts, same checksums) to stable without rebuilding.
          EOF

      - name: Create prerelease (preview channel)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.linux.outputs.tag }}
          VERSION: ${{ needs.linux.outputs.version }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.linux.outputs.pr-number }}
          RELEASE_NOTES_FILE: release-notes.md
        run: |
          # Release title carries the PR number when one was resolved, so
          # the GitHub Releases UI surfaces the originating PR without
          # opening the notes (same convention as phantombot).
          if [ -n "$PR_NUMBER" ]; then
            export RELEASE_TITLE="$TAG (PR #${PR_NUMBER})"
          fi
          bash scripts/publish-release.sh "$TAG" "$VERSION" "$SHA" "release/${VERSION}" "$REPO"
