name: app-release

# Desktop-app release pipeline (issue #150).
#
# Triggered by a `desktop-v*` tag (e.g. desktop-v1.0.42) or manually. Builds
# the platform artifacts from a clean checkout and publishes them to a GitHub
# **prerelease** — the preview channel. Stable users never see it until the
# "app-promote" workflow explicitly promotes the tested candidate; promotion
# changes release metadata only and never rebuilds.
#
# PR#1 (issue #150): Linux only — x64 AppImage + .deb, unsigned, with
# SHA-256 checksums. Windows/macOS targets are added by their own PRs; the
# promote workflow fails closed until every required artifact exists.
#
# Manual runs build from the branch they are dispatched from (GitHub
# dispatches on the selected branch's head; there is no ref input, keeping
# the built commit and the run's provenance in lockstep by construction).
# scripts/publish-release.sh owns tag/release immutability on both trigger
# paths: the synthesized manual tag is created pinned to the built commit,
# and any pre-existing tag pointing elsewhere fails the run.

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Versioning: the tag (or 1.0.<run_number> for manual runs) feeds both
      # the bundled UI version (APP_VERSION, same scheme as the PWA) and the
      # packaged app version via electron-builder's extraMetadata override —
      # the checked-in package.json version is never mutated.
      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/desktop-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/desktop-v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "trigger=tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "tag=desktop-v1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "trigger=manual" >> "$GITHUB_OUTPUT"
          fi

      - name: Build frontend + electron main/preload
        run: |
          pnpm run build
          node electron/build.mjs
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}

      - name: Package Linux artifacts (AppImage + deb, x64)
        run: pnpm exec electron-builder --linux --publish never -c.extraMetadata.version=${{ steps.ver.outputs.version }}

      - name: Generate checksums
        run: |
          cd release/${{ steps.ver.outputs.version }}
          sha256sum PhantomChat-*.AppImage phantomchat_*.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create prerelease (preview channel)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          TRIGGER: ${{ steps.ver.outputs.trigger }}
        run: bash scripts/publish-release.sh "$TAG" "$VERSION" "$GITHUB_SHA" "$TRIGGER" "release/${VERSION}"
