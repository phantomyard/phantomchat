<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="scout-ambient" cx="50%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Radar Sweep / Holographic Scan Cone -->
    <linearGradient id="scout-scan-beam" x1="50%" y1="45%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>

    <!-- Hero Cloak Gradient -->
    <linearGradient id="scout-cloak-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041a29"/>
      <stop offset="50%" stop-color="#073b54"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="scout-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="scout-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <clipPath id="scout-avatar-clip">
      <circle cx="80" cy="86" r="42"/>
    </clipPath>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="80" cy="80" r="76" fill="url(#scout-ambient)"/>

  <!-- Radar Tactical Grid / Reticle Rings -->
  <g opacity="0.4">
    <!-- Outer Notched Tactical Ring -->
    <circle cx="80" cy="80" r="74" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="3 7"/>
    <!-- Range Rings -->
    <circle cx="80" cy="80" r="58" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="80" cy="80" r="44" fill="none" stroke="#00f2fe" stroke-width="0.8" opacity="0.4"/>
    
    <!-- Crosshairs -->
    <line x1="80" y1="4" x2="80" y2="24" stroke="#00f2fe" stroke-width="1.5"/>
    <line x1="80" y1="136" x2="80" y2="156" stroke="#00f2fe" stroke-width="1.5"/>
    <line x1="4" y1="80" x2="24" y2="80" stroke="#00f2fe" stroke-width="1.5"/>
    <line x1="136" y1="80" x2="156" y2="80" stroke="#00f2fe" stroke-width="1.5"/>

    <!-- Subtle Center Cross Axes -->
    <line x1="28" y1="80" x2="132" y2="80" stroke="#00f2fe" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.3"/>
    <line x1="80" y1="28" x2="80" y2="132" stroke="#00f2fe" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.3"/>

    <!-- Tactical Corner Brackets -->
    <path d="M 20 30 L 20 20 L 30 20" fill="none" stroke="#00f2fe" stroke-width="1.5"/>
    <path d="M 140 30 L 140 20 L 130 20" fill="none" stroke="#00f2fe" stroke-width="1.5"/>
    <path d="M 20 130 L 20 140 L 30 140" fill="none" stroke="#00f2fe" stroke-width="1.5"/>
    <path d="M 140 130 L 140 140 L 130 140" fill="none" stroke="#00f2fe" stroke-width="1.5"/>
  </g>

  <!-- Holographic Radar Scan Fan / Cone -->
  <path d="M 80 80 L 148 38 A 74 74 0 0 1 154 84 Z" fill="url(#scout-scan-beam)" opacity="0.75"/>
  <line x1="80" y1="80" x2="148" y2="38" stroke="#00f2fe" stroke-width="1.5" opacity="0.8" filter="url(#scout-glow)"/>

  <!-- Radar Node Blips -->
  <circle cx="122" cy="52" r="2.5" fill="#00f2fe" filter="url(#scout-glow)"/>
  <circle cx="122" cy="52" r="5" fill="none" stroke="#00f2fe" stroke-width="0.8" opacity="0.5"/>
  <circle cx="46" cy="116" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="132" cy="108" r="1.5" fill="#38bdf8" opacity="0.5"/>

  <!-- Hero Phantom Scout -->
  <g id="phantom-scout-hero" filter="url(#scout-shadow)">
    <!-- Base Circular Badge Backdrop -->
    <circle cx="80" cy="86" r="44" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.4"/>

    <g clip-path="url(#scout-avatar-clip)">
      <!-- Background of Avatar Disk -->
      <circle cx="80" cy="86" r="42" fill="#051522"/>
      <circle cx="80" cy="86" r="41" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.7"/>

      <!-- Hooded Silhouette (scale 0.68 centered at 80, 86) -->
      <g transform="translate(80, 86) scale(0.68) translate(-64, -64)">
        <!-- Outer Cloak / Hood -->
        <path d="M 64 20 C 38 20 24 44 24 78 C 24 100 32 116 35 128 L 93 128 C 96 116 104 100 104 78 C 104 44 90 20 64 20 Z" fill="url(#scout-cloak-grad)" stroke="#38bdf8" stroke-width="2.5"/>
        
        <!-- Inner Face Void -->
        <path d="M 64 29 C 45 29 34 48 34 74 C 34 92 41 106 45 120 L 83 120 C 87 106 94 92 94 74 C 94 48 83 29 64 29 Z" fill="#080b11"/>

        <!-- Glowing Neon Cyan Scout Visor -->
        <rect x="42" y="64" width="44" height="10" rx="5" fill="#00f0ff" filter="url(#scout-glow)"/>
        <!-- Scanner Lens Highlights -->
        <circle cx="52" cy="69" r="2.2" fill="#ffffff"/>
        <circle cx="64" cy="69" r="2.8" fill="#ffffff"/>
        <circle cx="76" cy="69" r="2.2" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- Floating HUD Scan Crosshair / Target Lens over Visor -->
  <g transform="translate(80, 89)" opacity="0.85">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="3 3" filter="url(#scout-glow)"/>
    <line x1="-16" y1="0" x2="-8" y2="0" stroke="#00f2fe" stroke-width="1.2"/>
    <line x1="8" y1="0" x2="16" y2="0" stroke="#00f2fe" stroke-width="1.2"/>
    <line x1="0" y1="-16" x2="0" y2="-8" stroke="#00f2fe" stroke-width="1.2"/>
    <line x1="0" y1="8" x2="0" y2="16" stroke="#00f2fe" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>
</svg>
