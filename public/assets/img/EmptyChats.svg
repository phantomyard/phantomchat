<svg xmlns="http://www.w3.org/2000/svg" width="220" height="205" viewBox="0 0 220 205">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="ambient-glow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Phantom 1 (Left - Emerald) Gradients & Filter -->
    <linearGradient id="p-emerald-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022b1c"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow-emerald" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip-emerald">
      <circle cx="56" cy="76" r="36"/>
    </clipPath>

    <!-- Phantom 2 (Right - Amber/Gold) Gradients & Filter -->
    <linearGradient id="p-amber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1903"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow-amber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip-amber">
      <circle cx="164" cy="76" r="36"/>
    </clipPath>

    <!-- Phantom 3 (Center Hero - Electric Cyan) Gradients & Filter -->
    <linearGradient id="p-cyan-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#032030"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="hero-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="clip-cyan">
      <circle cx="110" cy="122" r="48"/>
    </clipPath>
  </defs>

  <!-- Ambient Backdrop -->
  <ellipse cx="110" cy="115" rx="100" ry="85" fill="url(#ambient-glow)"/>

  <!-- Network / Mesh Whisper Lines connecting the Trio -->
  <g opacity="0.35" stroke-dasharray="3 3">
    <line x1="56" y1="76" x2="110" y2="122" stroke="#10b981" stroke-width="1.5"/>
    <line x1="164" y1="76" x2="110" y2="122" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="56" y1="76" x2="164" y2="76" stroke="#00f2fe" stroke-width="1.2" opacity="0.5"/>
  </g>
  <circle cx="56" cy="76" r="38" fill="none" stroke="#10b981" stroke-width="1" opacity="0.2"/>
  <circle cx="164" cy="76" r="38" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.2"/>

  <!-- 1. LEFT PHANTOM (Emerald - Squad Scout) -->
  <g id="phantom-left">
    <g clip-path="url(#clip-emerald)">
      <circle cx="56" cy="76" r="36" fill="url(#p-emerald-bg)"/>
      <circle cx="56" cy="76" r="35" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.5"/>
      <!-- Outer Cloak / Hood (scale 0.56, centered at 56, 76) -->
      <!-- Original path scaled: M 64 20 C 38 20 24 44 24 78 C 24 100 32 116 35 128 L 93 128 C 96 116 104 100 104 78 C 104 44 90 20 64 20 Z -->
      <g transform="translate(56, 76) scale(0.56) translate(-64, -64)">
        <path d="M 64 20 C 38 20 24 44 24 78 C 24 100 32 116 35 128 L 93 128 C 96 116 104 100 104 78 C 104 44 90 20 64 20 Z" fill="#0a5c40" stroke="#34d39988" stroke-width="2"/>
        <!-- Inner Face Void -->
        <path d="M 64 29 C 45 29 34 48 34 74 C 34 92 41 106 45 120 L 83 120 C 87 106 94 92 94 74 C 94 48 83 29 64 29 Z" fill="#0b0e14"/>
        <!-- Angled Cyber Visor Eyes -->
        <path d="M 44 65 L 58 69 L 57 74 L 43 70 Z" fill="#05ffa1" filter="url(#glow-emerald)"/>
        <path d="M 84 65 L 70 69 L 71 74 L 85 70 Z" fill="#05ffa1" filter="url(#glow-emerald)"/>
        <circle cx="51" cy="70" r="2" fill="#ffffff"/>
        <circle cx="77" cy="70" r="2" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- 2. RIGHT PHANTOM (Amber/Gold - Squad Sentry) -->
  <g id="phantom-right">
    <g clip-path="url(#clip-amber)">
      <circle cx="164" cy="76" r="36" fill="url(#p-amber-bg)"/>
      <circle cx="164" cy="76" r="35" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
      <!-- Outer Cloak / Hood (scale 0.56, centered at 164, 76) -->
      <g transform="translate(164, 76) scale(0.56) translate(-64, -64)">
        <path d="M 64 20 C 38 20 24 44 24 78 C 24 100 32 116 35 128 L 93 128 C 96 116 104 100 104 78 C 104 44 90 20 64 20 Z" fill="#693709" stroke="#fbbf2488" stroke-width="2"/>
        <!-- Inner Face Void -->
        <path d="M 64 29 C 45 29 34 48 34 74 C 34 92 41 106 45 120 L 83 120 C 87 106 94 92 94 74 C 94 48 83 29 64 29 Z" fill="#0b0e14"/>
        <!-- Dual Circular Focus Eyes -->
        <circle cx="52" cy="69" r="6" fill="#fde047" filter="url(#glow-amber)"/>
        <circle cx="76" cy="69" r="6" fill="#fde047" filter="url(#glow-amber)"/>
        <circle cx="52" cy="69" r="2.5" fill="#ffffff"/>
        <circle cx="76" cy="69" r="2.5" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- 3. CENTER HERO PHANTOM (Electric Cyan - Squad Commander) -->
  <g id="phantom-hero" filter="url(#hero-shadow)">
    <!-- Outer Glow Ring -->
    <circle cx="110" cy="122" r="51" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.3" stroke-dasharray="6 4"/>
    
    <g clip-path="url(#clip-cyan)">
      <circle cx="110" cy="122" r="48" fill="url(#p-cyan-bg)"/>
      <circle cx="110" cy="122" r="46.5" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
      
      <!-- Outer Cloak / Hood (scale 0.75, centered at 110, 122) -->
      <g transform="translate(110, 122) scale(0.75) translate(-64, -64)">
        <path d="M 64 20 C 38 20 24 44 24 78 C 24 100 32 116 35 128 L 93 128 C 96 116 104 100 104 78 C 104 44 90 20 64 20 Z" fill="#094a6b" stroke="#38bdf888" stroke-width="2"/>
        <!-- Inner Face Void -->
        <path d="M 64 29 C 45 29 34 48 34 74 C 34 92 41 106 45 120 L 83 120 C 87 106 94 92 94 74 C 94 48 83 29 64 29 Z" fill="#0b0e14"/>
        <!-- Sleek Cyber Visor -->
        <rect x="44" y="65" width="40" height="9" rx="4.5" fill="#00f0ff" filter="url(#glow-cyan)"/>
        <circle cx="54" cy="69.5" r="2" fill="#ffffff"/>
        <circle cx="64" cy="69.5" r="2" fill="#ffffff"/>
        <circle cx="74" cy="69.5" r="2" fill="#ffffff"/>
      </g>
    </g>
  </g>
</svg>
